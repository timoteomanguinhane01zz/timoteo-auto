name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Dependencias do Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev aidl ccache
        pip install --upgrade pip setuptools buildozer cython

    - name: Compilar APK com Buildozer
      run: |
        yes | buildozer android debug

    - name: Disponibilizar APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: timoteo-auto-apk
        path: bin/*.apk
        
